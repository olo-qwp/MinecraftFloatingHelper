name: Build Minecraft Floating Helper Tweak

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        path: MinecraftTweak

    - name: Cache Theos
      id: cache-theos
      uses: actions/cache@v4
      with:
        path: theos
        key: ${{ runner.os }}-theos-${{ hashFiles('MinecraftTweak/Makefile') }}

    - name: Install Dependencies
      run: |
        brew install make xz ldid dpkg coreutils

    - name: Checkout Theos
      if: steps.cache-theos.outputs.cache-hit != 'true'
      uses: actions/checkout@v4
      with:
        repository: theos/theos
        ref: master
        submodules: recursive
        path: theos

    - name: Checkout Theos SDKs
      uses: actions/checkout@v4
      with:
        repository: theos/sdks
        path: theos/sdks
        sparse-checkout: |
          iPhoneOS14.5.sdk
          iPhoneOS15.0.sdk
          iPhoneOS16.0.sdk

    - name: Setup Environment
      run: |
        echo "THEOS=$GITHUB_WORKSPACE/theos" >> $GITHUB_ENV
        echo "$GITHUB_WORKSPACE/theos/bin" >> $GITHUB_PATH

    - name: Build Rootless Package (Dopamine arm64 arm64e)
      run: |
        cd MinecraftTweak
        export THEOS=$GITHUB_WORKSPACE/theos
        gmake clean package FINALPACKAGE=1 \
          THEOS_PACKAGE_SCHEME=rootless \
          ARCHS="arm64 arm64e" \
          TARGET="iphone:clang:latest:15.0"
        echo "✅ Dopamine 编译完成"

    - name: List Built Packages
      run: |
        echo "📦 编译产物:"
        find MinecraftTweak -name "*.deb" -type f
        echo "---"
        ls -la MinecraftTweak/packages/ 2>/dev/null || echo "packages/ 目录不存在"

    - name: Upload DEB Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: MinecraftFloatingHelper-DEB
        path: |
          MinecraftTweak/packages/*.deb
        if-no-files-found: warn
        retention-days: 30

  # 发布到GitHub Release (使用GITHUB_TOKEN自动获取权限)
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - name: Download Artifacts
      uses: actions/download-artifact@v4
      with:
        name: MinecraftFloatingHelper-DEB
        path: ./packages

    - name: List Packages
      run: ls -la ./packages/

    - name: Create Release with gh CLI
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create v1.0.2 \
          ./packages/*.deb \
          --title "MinecraftFloatingHelper v1.0.2" \
          --notes "## Minecraft Floating Helper v1.0.2

        🎮 iOS Minecraft PE 悬浮窗多功能辅助工具 — Dopamine 版

        ### 修复
        - 修复UI不显示的bug — 改用keyWindow直接添加，彻底解决UIWindow场景兼容问题
        - 修复control文件 — 适配Dopamine rootless (arm64架构, ellekit依赖)
        - 改用UIScrollView手动布局，避免TableView代理问题
        - 专注Dopamine rootless (iOS 15+)
        - 简化plist过滤器，兼容ElleKit注入

        ### ✨ 13项功能
        - 🪶 **飞行** - 自由飞行模式
        - ⚡ **加速** - 3.5倍移动速度
        - ⚔️ **杀戮光环** - 自动攻击附近敌人
        - 👁️ **ESP透视** - 透视实体位置
        - 💎 **矿透X-Ray** - 透视矿物方块
        - 🛡️ **防摔** - 免疫摔落伤害
        - ⛏️ **自动挖矿** - 快速破坏方块
        - 🍖 **自动吃** - 自动补充饱食度
        - 📏 **范围扩大** - 增加交互距离
        - 🧱 **防击退** - 免疫击退效果
        - ☀️ **夜视** - 永久明亮视野
        - 🔧 **自动工具** - 自动切换最佳工具
        - 👻 **穿墙** - 穿越方块移动

        ### 📦 安装
        - 下载 .deb 文件
        - 通过 Sileo / Zebra 安装
        - 或通过 iGameGod 导入

        ### ⚙️ 兼容性
        - Dopamine rootless (iOS 15+)
        - A11芯片 (iPhone 8/X) 60fps
        - 加载器: ElleKit" \
          --repo ${{ github.repository }} || true